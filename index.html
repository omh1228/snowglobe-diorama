<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>겨울밤 스노우볼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --night: #0a1426;
    --ink: #ece4d6;
    --ink-soft: rgba(236, 228, 214, 0.62);
    --amber: #fab155;
    --serif: "Gowun Batang", "Nanum Myeongjo", "Noto Serif KR", "Apple SD Gothic Neo", Georgia, serif;
  }
  html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; }
  body { font-family: var(--serif); color: var(--ink); }
  canvas#scene {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    cursor: grab; touch-action: none; outline: none;
    opacity: 0; transition: opacity 2.2s ease;
  }
  body.ready canvas#scene { opacity: 1; }

  #hud {
    position: fixed;
    left: max(28px, env(safe-area-inset-left));
    bottom: max(26px, env(safe-area-inset-bottom));
    max-width: 40ch;
    word-break: keep-all;
    pointer-events: none;
    opacity: 0; transform: translateY(6px);
    transition: opacity 1.6s ease 1.4s, transform 1.6s ease 1.4s;
  }
  body.ready #hud { opacity: 1; transform: none; }
  #hud h1 {
    margin: 0 0 0.35em;
    font-size: clamp(22px, 2.4vw, 30px);
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.15;
    color: var(--ink);
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
  }
  #hud p {
    margin: 0;
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink-soft);
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.7);
  }
  #hud p b { color: var(--amber); font-weight: 400; }
  #hud.used p { opacity: 0.5; transition: opacity 1.2s ease; }

  #tip {
    position: fixed; left: 0; top: 0; pointer-events: none;
    padding: 5px 10px; border-radius: 999px;
    background: rgba(10, 18, 34, 0.82); color: var(--ink);
    border: 1px solid rgba(250, 177, 85, 0.35);
    font-size: 12.5px; white-space: nowrap;
    opacity: 0; transition: opacity 0.18s ease;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #tip.on { opacity: 1; }
  #fallback[hidden] { display: none; }
  #fallback {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
    text-align: center; font-size: 16px; line-height: 1.7; color: var(--ink);
  }

  /* 조절 패널 */
  .lil-gui {
    --background-color: rgba(10, 18, 34, 0.78);
    --widget-color: rgba(255, 255, 255, 0.09);
    --hover-color: rgba(255, 255, 255, 0.14);
    --focus-color: rgba(250, 177, 85, 0.28);
    --number-color: #fab155;
    --string-color: #fab155;
    --text-color: #ece4d6;
    --title-background-color: rgba(6, 12, 24, 0.85);
    --title-text-color: #ece4d6;
    --font-family: "Gowun Batang", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
    --font-size: 12.5px;
    --input-font-size: 12px;
    --widget-height: 22px;
    --name-width: 42%;
    --border-radius: 4px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .lil-gui.root { top: max(14px, env(safe-area-inset-top)) !important; right: 14px !important; width: 270px; border-radius: 8px; overflow: hidden; }
  .lil-gui .controller.function .name { color: var(--amber); }
  .lil-gui button:focus-visible, .lil-gui input:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }

  @media (max-width: 600px) {
    #hud { left: 18px; bottom: 18px; }
    #hud p { font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    canvas#scene, #hud { transition: none; }
  }
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="유리 스노우볼 3D 장면. 드래그로 회전, 클릭하거나 스페이스바로 흔들 수 있습니다."></canvas>
<div id="hud">
  <h1>겨울밤 스노우볼</h1>
  <p>드래그로 돌려 보고, 휠로 다가가 보세요.<br>유리를 <b>클릭</b>하면 눈보라가 일고, 유리 위를 쓸면 <b>입김</b>이 서려요.<br>오두막 창문, 트리, 눈사람, 굴뚝, 받침대 태엽도 <b>눌러 보세요</b>.</p>
</div>
<div id="tip" role="status" aria-live="polite"></div>
<div id="fallback" hidden>이 브라우저에서 WebGL을 쓸 수 없어 장면을 그리지 못했어요.<br>최신 크롬에서 하드웨어 가속을 켠 뒤 다시 열어 주세요.</div>

.lil-gui, .lil-gui * {

  margin: 0;
  padding: 0;
}

  display: flex;
  flex-direction: column;
  background: var(--background-color);
}
.lil-gui.root > .title {
  background: var(--title-background-color);
  color: var(--title-text-color);
}
.lil-gui.root > .children {
  overflow-x: hidden;
  overflow-y: auto;
}
.lil-gui.root > .children::-webkit-scrollbar {
  width: var(--scrollbar-width);
  height: var(--scrollbar-width);
  background: var(--background-color);
}
.lil-gui.root > .children::-webkit-scrollbar-thumb {
  border-radius: var(--scrollbar-width);
  background: var(--focus-color);
}
@media (pointer: coarse) {

    --scrollbar-width: 7px;
    --slider-input-min-width: 50px;
    --color-input-min-width: 65px;
  }
}
.lil-gui.force-touch-styles, .lil-gui.force-touch-styles .lil-gui {
  --widget-height: 28px;
  --padding: 6px;
  --spacing: 6px;
  --font-size: 13px;

  --slider-input-min-width: 50px;
  --color-input-min-width: 65px;
}

  top: 0;

}

}
.lil-gui .controller.disabled {

.lil-gui .controller .widget {

    content: " ";
    display: block;
    position: absolute;
    border-radius: var(--widget-border-radius);
    border: 1px solid #fff9;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
  }
}
.lil-gui .controller.color input[type=color] {
  opacity: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
}
.lil-gui .controller.color input[type=text] {
  margin-left: var(--spacing);
  font-family: var(--font-family-mono);
  min-width: var(--color-input-min-width);
  width: var(--color-input-width);
  flex-shrink: 0;
}
.lil-gui .controller.option select {
  opacity: 0;
  position: absolute;
  width: 100%;
  max-width: 100%;
}
.lil-gui .controller.option .display {
  position: relative;
  pointer-events: none;
  border-radius: var(--widget-border-radius);
  height: var(--widget-height);
  line-height: var(--widget-height);
  max-width: 100%;
  overflow: hidden;
  word-break: break-all;
  padding-left: 0.55em;
  padding-right: 1.75em;
  background: var(--widget-color);
}
@media (hover: hover) {
  .lil-gui .controller.option .display.focus {
    background: var(--focus-color);
  }
}
.lil-gui .controller.option .display.active {
  background: var(--focus-color);
}
.lil-gui .controller.option .display:after {
  font-family: "lil-gui";
  content: "\u2195";
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  padding-right: 0.375em;
}
.lil-gui .controller.option .widget,
.lil-gui .controller.option select {
  cursor: pointer;
}
@media (hover: hover) {
  .lil-gui .controller.option .widget:hover .display {
    background: var(--hover-color);
  }
}
.lil-gui .controller.number input {
  color: var(--number-color);
}
.lil-gui .controller.number.hasSlider input {
  margin-left: var(--spacing);
  width: var(--slider-input-width);
  min-width: var(--slider-input-min-width);
  flex-shrink: 0;
}
.lil-gui .controller.number .slider {
  width: 100%;
  height: var(--widget-height);
  background: var(--widget-color);
  border-radius: var(--widget-border-radius);
  padding-right: var(--slider-knob-width);
  overflow: hidden;
  cursor: ew-resize;
  touch-action: pan-y;
}
@media (hover: hover) {
  .lil-gui .controller.number .slider:hover {
    background: var(--hover-color);
  }
}
.lil-gui .controller.number .slider.active {
  background: var(--focus-color);
}
.lil-gui .controller.number .slider.active .fill {
  opacity: 0.95;
}
.lil-gui .controller.number .fill {
  height: 100%;
  border-right: var(--slider-knob-width) solid var(--number-color);
  box-sizing: content-box;
}

.lil-gui-dragging .lil-gui {
  --hover-color: var(--widget-color);
}
.lil-gui-dragging * {
  cursor: ew-resize !important;
}

.lil-gui-dragging.lil-gui-vertical * {
  cursor: ns-resize !important;
}

.lil-gui .title {
  height: var(--title-height);
  line-height: calc(var(--title-height) - 4px);
  font-weight: 600;
  padding: 0 var(--padding);
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
  outline: none;
  text-decoration-skip: objects;
}
.lil-gui .title:before {
  font-family: "lil-gui";
  content: "\u25BE";
  padding-right: 2px;
  display: inline-block;
}
.lil-gui .title:active {
  background: var(--title-background-color);
  opacity: 0.75;
}
@media (hover: hover) {
  body:not(.lil-gui-dragging) .lil-gui .title:hover {
    background: var(--title-background-color);
    opacity: 0.85;
  }
  .lil-gui .title:focus {
    text-decoration: underline var(--focus-color);
  }
}
.lil-gui.root > .title:focus {
  text-decoration: none !important;
}
.lil-gui.closed > .title:before {
  content: "\u25B8";
}
.lil-gui.closed > .children {
  transform: translateY(-7px);
  opacity: 0;
}
.lil-gui.closed:not(.transition) > .children {
  display: none;
}
.lil-gui.transition > .children {
  transition-duration: 300ms;
  transition-property: height, opacity, transform;
  transition-timing-function: cubic-bezier(0.2, 0.6, 0.35, 1);
  overflow: hidden;
  pointer-events: none;
}
.lil-gui .children:empty:before {
  content: "Empty";
  padding: 0 var(--padding);
  margin: var(--spacing) 0;
  display: block;
  height: var(--widget-height);
  font-style: italic;
  line-height: var(--widget-height);
  opacity: 0.5;
}
.lil-gui.root > .children > .lil-gui > .title {
  border: 0 solid var(--widget-color);
  border-width: 1px 0;
  transition: border-color 300ms;
}
.lil-gui.root > .children > .lil-gui.closed > .title {
  border-bottom-color: transparent;
}
.lil-gui + .controller {
  border-top: 1px solid var(--widget-color);
  margin-top: 0;
  padding-top: var(--spacing);
}
.lil-gui .lil-gui .lil-gui > .title {
  border: none;
}
.lil-gui .lil-gui .lil-gui > .children {
  border: none;
  margin-left: var(--folder-indent);
  border-left: 2px solid var(--widget-color);
}
.lil-gui .lil-gui .controller {
  border: none;
}

.lil-gui label, .lil-gui input, .lil-gui button {
  -webkit-tap-highlight-color: transparent;
}
.lil-gui input {
  border: 0;
  outline: none;
  font-family: var(--font-family);
  font-size: var(--input-font-size);
  border-radius: var(--widget-border-radius);
  height: var(--widget-height);
  background: var(--widget-color);
  color: var(--text-color);
  width: 100%;
}
@media (hover: hover) {
  .lil-gui input:hover {
    background: var(--hover-color);
  }
  .lil-gui input:active {
    background: var(--focus-color);
  }
}
.lil-gui input:disabled {
  opacity: 1;
}
.lil-gui input[type=text],
.lil-gui input[type=number] {
  padding: var(--widget-padding);
  -moz-appearance: textfield;
}
.lil-gui input[type=text]:focus,
.lil-gui input[type=number]:focus {
  background: var(--focus-color);
}
.lil-gui input[type=checkbox] {
  appearance: none;
  width: var(--checkbox-size);
  height: var(--checkbox-size);
  border-radius: var(--widget-border-radius);
  text-align: center;
  cursor: pointer;
}
.lil-gui input[type=checkbox]:checked:before {
  font-family: "lil-gui";
  content: "\u2713";
  font-size: var(--checkbox-size);
  line-height: var(--checkbox-size);
}
@media (hover: hover) {
  .lil-gui input[type=checkbox]:focus {
    box-shadow: inset 0 0 0 1px var(--focus-color);
  }
}
.lil-gui button {
  outline: none;
  cursor: pointer;
  font-family: var(--font-family);
  font-size: var(--font-size);
  color: var(--text-color);
  width: 100%;
  height: var(--widget-height);
  text-transform: none;
  background: var(--widget-color);
  border-radius: var(--widget-border-radius);
  border: none;
}
@media (hover: hover) {
  .lil-gui button:hover {
    background: var(--hover-color);
  }
  .lil-gui button:focus {
    box-shadow: inset 0 0 0 1px var(--focus-color);
  }
}
.lil-gui button:active {
  background: var(--focus-color);
}
